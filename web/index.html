<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rádio Web</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #eef1f5;
            color: #263238;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
        }

        .navegacao {
            display: flex;
            gap: 9px;
            margin-bottom: 16px;
        }

        .navegacao a {
            color: #1976d2;
            font-size: 14px;
            text-decoration: none;
        }

        .navegacao a + a::before {
            margin-right: 9px;
            color: #a4adb2;
            content: "•";
        }

        .cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .cabecalho h1 {
            margin: 0;
            font-size: 26px;
        }

        .cabecalho p {
            margin: 5px 0 0;
            color: #68757d;
            font-size: 14px;
        }

        button {
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-nova {
            flex-shrink: 0;
            padding: 12px 18px;
            background: #1976d2;
            color: white;
            font-weight: bold;
        }

        .btn-nova:hover {
            background: #125ea9;
        }

        .acoes-cabecalho {
            display: flex;
            flex-shrink: 0;
            gap: 10px;
        }

        .btn-pesquisar {
            padding: 12px 18px;
            background: white;
            color: #1976d2;
            border: 1px solid #1976d2;
            font-weight: bold;
        }

        .btn-pesquisar:hover {
            background: #eaf3fb;
        }

        .painel {
            overflow: hidden;
            background: white;
            border-radius: 9px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08);
        }

        .tabela-responsiva {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #e6e9ec;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f8f9fa;
            color: #546168;
            font-size: 13px;
            text-transform: uppercase;
        }

        th:nth-child(1) {
            width: 25%;
        }

        th:nth-child(2) {
            width: 50%;
        }

        th:nth-child(3) {
            width: 15%;
            text-align: center;
        }

        th:nth-child(4) {
            width: 10%;
            text-align: center;
        }

        td:nth-child(3),
        td:nth-child(4) {
            text-align: center;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .radio-nome {
            font-weight: bold;
        }

        .radio-url {
            display: block;
            max-width: 500px;
            overflow: hidden;
            color: #607d8b;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .estrelas-tabela {
            color: #f5a623;
            font-size: 19px;
            white-space: nowrap;
        }

        .estrela-vazia {
            color: #d6dadd;
        }

        .btn-excluir {
            padding: 8px 12px;
            background: #ffebee;
            color: #c62828;
        }

        .btn-excluir:hover {
            background: #ffcdd2;
        }

        .lista-vazia {
            padding: 45px 20px;
            color: #7b878d;
            text-align: center;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(20, 30, 35, 0.65);
        }

        .modal.aberto {
            display: flex;
        }

        .modal-conteudo {
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            background: white;
            border-radius: 10px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }

        .modal-cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 19px 22px;
            border-bottom: 1px solid #e6e9ec;
        }

        .modal-cabecalho h2 {
            margin: 0;
            font-size: 21px;
        }

        .btn-fechar {
            padding: 4px 8px;
            background: transparent;
            color: #68757d;
            font-size: 26px;
            line-height: 1;
        }

        .modal-corpo {
            padding: 22px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cfd6da;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        .campo input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.12);
        }

        .seletor-estrelas {
            display: flex;
            gap: 5px;
        }

        .seletor-estrelas button {
            padding: 0;
            background: transparent;
            color: #d6dadd;
            font-size: 32px;
            line-height: 1;
        }

        .seletor-estrelas button.ativa {
            color: #f5a623;
        }

        .modal-rodape {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 16px 22px;
            background: #f8f9fa;
            border-top: 1px solid #e6e9ec;
        }

        .btn-cancelar,
        .btn-adicionar {
            padding: 10px 17px;
        }

        .btn-cancelar {
            background: #e4e8ea;
            color: #37474f;
        }

        .btn-adicionar {
            background: #1976d2;
            color: white;
            font-weight: bold;
        }

        .btn-adicionar:hover {
            background: #125ea9;
        }

        .modal-pesquisa-conteudo {
            display: flex;
            width: 100%;
            max-width: 900px;
            max-height: calc(100vh - 40px);
            flex-direction: column;
        }

        .filtros-pesquisa {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .campo-pesquisa label {
            display: block;
            margin-bottom: 6px;
            color: #546168;
            font-size: 13px;
            font-weight: bold;
        }

        .campo-pesquisa input,
        .campo-pesquisa select {
            width: 100%;
            min-width: 0;
            padding: 11px 12px;
            border: 1px solid #cfd6da;
            border-radius: 6px;
            background: white;
            outline: none;
            font-size: 15px;
        }

        .campo-pesquisa input:focus,
        .campo-pesquisa select:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.12);
        }

        .linha-pesquisa {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .linha-pesquisa .campo-pesquisa {
            min-width: 0;
            flex: 1;
        }

        .btn-buscar {
            padding: 11px 20px;
            background: #1976d2;
            color: white;
            font-weight: bold;
        }

        .dica-pesquisa {
            margin: 10px 0 0;
            color: #546168;
            font-size: 12px;
        }

        .preview {
            display: none;
            align-items: center;
            gap: 15px;
            margin-top: 18px;
            padding: 12px 14px;
            background: #eef6fd;
            border-radius: 7px;
        }

        .preview.ativo {
            display: flex;
        }

        .preview-informacao {
            min-width: 0;
            flex: 1;
        }

        .preview-informacao strong,
        .preview-informacao span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preview-informacao span {
            margin-top: 3px;
            color: #607d8b;
            font-size: 12px;
        }

        .preview audio {
            width: 300px;
            max-width: 100%;
            height: 38px;
        }

        .resultados-pesquisa {
            min-height: 150px;
            max-height: 55vh;
            overflow-y: auto;
            padding: 0 22px 22px;
        }

        .mensagem-pesquisa {
            padding: 38px 15px;
            color: #7b878d;
            text-align: center;
        }

        .resultado-radio {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 15px 0;
            border-bottom: 1px solid #e6e9ec;
        }

        .resultado-radio:last-child {
            border-bottom: 0;
        }

        .resultado-informacao {
            min-width: 0;
            flex: 1;
        }

        .resultado-nome {
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .resultado-detalhes {
            color: #68757d;
            font-size: 13px;
        }

        .resultado-url {
            display: block;
            overflow: hidden;
            margin-top: 5px;
            color: #78909c;
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .resultado-acoes {
            display: flex;
            flex-shrink: 0;
            gap: 8px;
        }

        .btn-testar,
        .btn-importar {
            padding: 9px 13px;
            font-weight: bold;
        }

        .btn-testar {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .btn-testar.tocando {
            background: #fff3e0;
            color: #e65100;
        }

        .btn-importar {
            background: #1976d2;
            color: white;
        }

        @media (max-width: 650px) {
            body {
                padding: 15px;
            }

            .cabecalho {
                align-items: stretch;
                flex-direction: column;
            }

            .acoes-cabecalho {
                flex-direction: column;
            }

            .btn-nova,
            .btn-pesquisar {
                width: 100%;
            }

            th,
            td {
                padding: 12px 10px;
            }

            .radio-url {
                max-width: 190px;
            }

            .texto-excluir {
                display: none;
            }

            .btn-excluir::after {
                content: "Excluir";
            }

            .filtros-pesquisa {
                grid-template-columns: 1fr;
            }

            .linha-pesquisa,
            .preview,
            .resultado-radio {
                align-items: stretch;
                flex-direction: column;
            }

            .btn-buscar {
                width: 100%;
            }

            .preview audio {
                width: 100%;
            }

            .resultado-acoes {
                width: 100%;
            }

            .btn-testar,
            .btn-importar {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <nav class="navegacao">
            <a href="/">Rádios</a>
            <a href="/alarmes">Alarmes</a>
            <a href="/upload">Arquivos</a>
        </nav>

        <header class="cabecalho">
            <div>
                <h1>Rádios cadastradas</h1>
                <p id="quantidadeRadios">Nenhuma rádio cadastrada</p>
            </div>

            <div class="acoes-cabecalho">
                <button
                    type="button"
                    class="btn-pesquisar"
                    id="btnPesquisarRadio"
                >
                    Pesquisar rádios
                </button>

                <button type="button" class="btn-nova" id="btnNovaRadio">
                    + Nova rádio
                </button>
            </div>
        </header>

        <section class="painel">
            <div class="tabela-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>URL</th>
                            <th>Estrelas</th>
                            <th>Excluir</th>
                        </tr>
                    </thead>

                    <tbody id="corpoTabela"></tbody>
                </table>
            </div>

            <div class="lista-vazia" id="listaVazia">
                Nenhuma rádio cadastrada.
            </div>
        </section>
    </main>

    <div class="modal" id="modalRadio">
        <div class="modal-conteudo">
            <form id="formRadio">
                <div class="modal-cabecalho">
                    <h2>Nova rádio</h2>

                    <button
                        type="button"
                        class="btn-fechar"
                        id="btnFecharModal"
                        aria-label="Fechar"
                    >
                        &times;
                    </button>
                </div>

                <div class="modal-corpo">
                    <div class="campo">
                        <label for="nome">Nome</label>

                        <input
                            type="text"
                            id="nome"
                            maxlength="50"
                            required
                            autocomplete="off"
                        >
                    </div>

                    <div class="campo">
                        <label for="url">URL da transmissão</label>

                        <input
                            type="url"
                            id="url"
                            placeholder="https://..."
                            required
                            autocomplete="off"
                        >
                    </div>

                    <div class="campo">
                        <label>Avaliação</label>

                        <div class="seletor-estrelas" id="seletorEstrelas">
                            <button type="button" data-valor="1">★</button>
                            <button type="button" data-valor="2">★</button>
                            <button type="button" data-valor="3">★</button>
                            <button type="button" data-valor="4">★</button>
                            <button type="button" data-valor="5">★</button>
                        </div>
                    </div>
                </div>

                <div class="modal-rodape">
                    <button
                        type="button"
                        class="btn-cancelar"
                        id="btnCancelar"
                    >
                        Cancelar
                    </button>

                    <button type="submit" class="btn-adicionar">
                        Adicionar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="modalPesquisa">
        <div class="modal-conteudo modal-pesquisa-conteudo">
            <div class="modal-cabecalho">
                <h2>Pesquisar rádios</h2>

                <button
                    type="button"
                    class="btn-fechar"
                    id="btnFecharPesquisa"
                    aria-label="Fechar"
                >
                    &times;
                </button>
            </div>

            <div class="modal-corpo">
                <form class="pesquisa-form" id="formPesquisa">
                    <div class="filtros-pesquisa">
                        <div class="campo-pesquisa">
                            <label for="paisPesquisa">País</label>

                            <select id="paisPesquisa">
                                <option value="">Todos os países</option>
                                <option value="BR" selected>Brasil</option>
                                <option value="AR">Argentina</option>
                                <option value="AU">Austrália</option>
                                <option value="CA">Canadá</option>
                                <option value="CL">Chile</option>
                                <option value="CO">Colômbia</option>
                                <option value="DE">Alemanha</option>
                                <option value="ES">Espanha</option>
                                <option value="FR">França</option>
                                <option value="GB">Reino Unido</option>
                                <option value="IT">Itália</option>
                                <option value="JP">Japão</option>
                                <option value="MX">México</option>
                                <option value="NZ">New Zealand</option>
                                <option value="NL">Países Baixos</option>
                                <option value="PT">Portugal</option>
                                <option value="US">Estados Unidos</option>
                                <option value="UY">Uruguai</option>
                            </select>
                        </div>

                        <div class="campo-pesquisa">
                            <label for="generoPesquisa">Gênero</label>

                            <select id="generoPesquisa">
                                <option value="">Todos os gêneros</option>
                                <option value="rock">Rock</option>
                                <option value="pop">Pop</option>
                                <option value="jazz">Jazz</option>
                                <option value="blues">Blues</option>
                                <option value="electronic">Eletrônica</option>
                                <option value="classical">Clássica</option>
                                <option value="country">Country</option>
                                <option value="mpb">MPB</option>
                                <option value="sertanejo">Sertanejo</option>
                                <option value="gospel">Gospel</option>
                                <option value="news">Notícias</option>
                                <option value="sports">Esportes</option>
                            </select>
                        </div>
                    </div>

                    <div class="linha-pesquisa">
                        <div class="campo-pesquisa">
                            <label for="termoPesquisa">
                                Nome da rádio (opcional)
                            </label>

                            <input
                                type="search"
                                id="termoPesquisa"
                                placeholder="Ex.: Antena 1, Alpha FM..."
                                autocomplete="off"
                            >
                        </div>

                        <button type="submit" class="btn-buscar">
                            Buscar
                        </button>
                    </div>
                </form>

                <p class="dica-pesquisa">
                    Você pode combinar país, gênero e nome.
                </p>

                <div class="preview" id="areaPreview">
                    <div class="preview-informacao">
                        <strong id="nomePreview"></strong>
                        <span id="statusPreview">Carregando transmissão...</span>
                    </div>

                    <audio id="playerPreview" controls></audio>
                </div>
            </div>

            <div class="resultados-pesquisa" id="resultadosPesquisa">
                <div class="mensagem-pesquisa">
                    Digite o nome de uma rádio para pesquisar.
                </div>
            </div>
        </div>
    </div>

   <script>
    const corpoTabela = document.getElementById("corpoTabela");
    const listaVazia = document.getElementById("listaVazia");
    const quantidadeRadios = document.getElementById("quantidadeRadios");

    const modalRadio = document.getElementById("modalRadio");
    const formRadio = document.getElementById("formRadio");
    const campoNome = document.getElementById("nome");
    const campoUrl = document.getElementById("url");

    const modalPesquisa = document.getElementById("modalPesquisa");
    const formPesquisa = document.getElementById("formPesquisa");
    const termoPesquisa = document.getElementById("termoPesquisa");
    const paisPesquisa = document.getElementById("paisPesquisa");
    const generoPesquisa = document.getElementById("generoPesquisa");
    const resultadosPesquisa = document.getElementById(
        "resultadosPesquisa"
    );
    const areaPreview = document.getElementById("areaPreview");
    const nomePreview = document.getElementById("nomePreview");
    const statusPreview = document.getElementById("statusPreview");
    const playerPreview = document.getElementById("playerPreview");

    const botoesEstrelas = document.querySelectorAll(
        "#seletorEstrelas button"
    );

    let estrelasSelecionadas = 3;
    let radios = [];
    let radiosEncontradas = [];
    let indicePreview = -1;

    function escaparHtml(texto) {
        const elemento = document.createElement("div");
        elemento.textContent = texto;

        return elemento.innerHTML;
    }

    function criarTextoEstrelas(quantidade) {
        let html = "";

        for (let i = 1; i <= 5; i++) {
            if (i <= quantidade) {
                html += "<span>★</span>";
            } else {
                html += '<span class="estrela-vazia">★</span>';
            }
        }

        return html;
    }

    function renderizarRadios() {
        corpoTabela.innerHTML = "";

        listaVazia.style.display =
            radios.length === 0 ? "block" : "none";

        if (radios.length === 1) {
            quantidadeRadios.textContent = "1 rádio cadastrada";
        } else if (radios.length > 1) {
            quantidadeRadios.textContent =
                radios.length + " rádios cadastradas";
        } else {
            quantidadeRadios.textContent =
                "Nenhuma rádio cadastrada";
        }

        radios.forEach(function (radio) {
            const linha = document.createElement("tr");

            linha.innerHTML = `
                <td>
                    <span class="radio-nome">
                        ${escaparHtml(radio.nome)}
                    </span>
                </td>

                <td>
                    <span
                        class="radio-url"
                        title="${escaparHtml(radio.url)}"
                    >
                        ${escaparHtml(radio.url)}
                    </span>
                </td>

                <td>
                    <span class="estrelas-tabela">
                        ${criarTextoEstrelas(radio.estrelas)}
                    </span>
                </td>

                <td>
                    <button
                        type="button"
                        class="btn-excluir"
                        data-id="${radio.id}"
                    >
                        <span class="texto-excluir">
                            Excluir
                        </span>
                    </button>
                </td>
            `;

            corpoTabela.appendChild(linha);
        });
    }

    async function carregarRadios() {
        quantidadeRadios.textContent = "Carregando rádios...";

        try {
            const resposta = await fetch("/api/radios");

            if (!resposta.ok) {
                throw new Error("Falha ao carregar as rádios");
            }

            radios = await resposta.json();

            if (!Array.isArray(radios)) {
                radios = [];
            }

            renderizarRadios();
        } catch (erro) {
            radios = [];
            renderizarRadios();

            quantidadeRadios.textContent =
                "Não foi possível carregar as rádios";

            alert(erro.message);
        }
    }

    function abrirModal(nome, url) {
        formRadio.reset();

        estrelasSelecionadas = 3;
        atualizarSeletorEstrelas();

        campoNome.value = nome || "";
        campoUrl.value = url || "";

        modalRadio.classList.add("aberto");
        campoNome.focus();
    }

    function fecharModal() {
        modalRadio.classList.remove("aberto");
    }

    function atualizarSeletorEstrelas() {
        botoesEstrelas.forEach(function (botao) {
            const valor = Number(botao.dataset.valor);

            botao.classList.toggle(
                "ativa",
                valor <= estrelasSelecionadas
            );
        });
    }

    function abrirPesquisa() {
        modalPesquisa.classList.add("aberto");
        termoPesquisa.focus();
    }

    function pararPreview() {
        playerPreview.pause();
        playerPreview.removeAttribute("src");
        playerPreview.load();

        areaPreview.classList.remove("ativo");
        indicePreview = -1;

        resultadosPesquisa
            .querySelectorAll(".btn-testar")
            .forEach(function (botao) {
                botao.classList.remove("tocando");
                botao.textContent = "Testar";
            });
    }

    function fecharPesquisa() {
        pararPreview();
        modalPesquisa.classList.remove("aberto");
    }

    function obterUrlRadio(radio) {
        return radio.url_resolved || radio.url || "";
    }

    function criarDetalhesRadio(radio) {
        const detalhes = [];

        if (radio.state) {
            detalhes.push(radio.state);
        } else if (radio.country) {
            detalhes.push(radio.country);
        }

        if (radio.codec) {
            detalhes.push(radio.codec);
        }

        if (Number(radio.bitrate) > 0) {
            detalhes.push(radio.bitrate + " kbps");
        }

        detalhes.push((Number(radio.votes) || 0) + " votos");

        return detalhes.join(" · ");
    }

    function renderizarResultadosPesquisa() {
        if (radiosEncontradas.length === 0) {
            resultadosPesquisa.innerHTML = `
                <div class="mensagem-pesquisa">
                    Nenhuma rádio encontrada.
                </div>
            `;

            return;
        }

        resultadosPesquisa.innerHTML =
            radiosEncontradas.map(function (radio, indice) {
                const url = obterUrlRadio(radio);

                return `
                    <div class="resultado-radio">
                        <div class="resultado-informacao">
                            <strong class="resultado-nome">
                                ${escaparHtml(radio.name || "Sem nome")}
                            </strong>

                            <span class="resultado-detalhes">
                                ${escaparHtml(criarDetalhesRadio(radio))}
                            </span>

                            <span
                                class="resultado-url"
                                title="${escaparHtml(url)}"
                            >
                                ${escaparHtml(url)}
                            </span>
                        </div>

                        <div class="resultado-acoes">
                            <button
                                type="button"
                                class="btn-testar"
                                data-indice="${indice}"
                            >
                                Testar
                            </button>

                            <button
                                type="button"
                                class="btn-importar"
                                data-indice="${indice}"
                            >
                                Adicionar
                            </button>
                        </div>
                    </div>
                `;
            }).join("");
    }

    async function pesquisarRadios() {
        const termo = termoPesquisa.value.trim();
        const pais = paisPesquisa.value;
        const genero = generoPesquisa.value;

        pararPreview();

        resultadosPesquisa.innerHTML = `
            <div class="mensagem-pesquisa">
                Pesquisando...
            </div>
        `;

        const parametros = new URLSearchParams({
            hidebroken: "true",
            order: "votes",
            reverse: "true",
            limit: "30"
        });

        if (termo) {
            parametros.set("name", termo);
        }

        if (pais) {
            parametros.set("countrycode", pais);
        }

        if (genero) {
            parametros.set("tag", genero);
        }

        const servidores = [
            "https://de1.api.radio-browser.info",
            "https://at1.api.radio-browser.info",
            "https://nl1.api.radio-browser.info"
        ];

        let ultimoErro = null;

        for (const servidor of servidores) {
            try {
                const resposta = await fetch(
                    servidor +
                    "/json/stations/search?" +
                    parametros.toString()
                );

                if (!resposta.ok) {
                    throw new Error("Servidor indisponível");
                }

                const dados = await resposta.json();

                radiosEncontradas = Array.isArray(dados)
                    ? dados.filter(function (radio) {
                        return Boolean(obterUrlRadio(radio));
                    })
                    : [];

                renderizarResultadosPesquisa();

                return;
            } catch (erro) {
                ultimoErro = erro;
            }
        }

        radiosEncontradas = [];
        resultadosPesquisa.innerHTML = `
            <div class="mensagem-pesquisa">
                Não foi possível consultar o Radio Browser.
                Verifique a internet e tente novamente.
            </div>
        `;

        console.error(ultimoErro);
    }

    function testarRadio(indice) {
        const radio = radiosEncontradas[indice];

        if (!radio) {
            return;
        }

        if (indicePreview === indice && !playerPreview.paused) {
            playerPreview.pause();

            const botaoAtual = resultadosPesquisa.querySelector(
                '.btn-testar[data-indice="' + indice + '"]'
            );

            if (botaoAtual) {
                botaoAtual.classList.remove("tocando");
                botaoAtual.textContent = "Testar";
            }

            return;
        }

        pararPreview();

        indicePreview = indice;
        nomePreview.textContent = radio.name || "Sem nome";
        statusPreview.textContent = "Carregando transmissão...";
        areaPreview.classList.add("ativo");

        const botao = resultadosPesquisa.querySelector(
            '.btn-testar[data-indice="' + indice + '"]'
        );

        if (botao) {
            botao.classList.add("tocando");
            botao.textContent = "Parar";
        }

        playerPreview.src = obterUrlRadio(radio);

        playerPreview.play().catch(function () {
            statusPreview.textContent =
                "O navegador não conseguiu reproduzir esta transmissão.";

            if (botao) {
                botao.classList.remove("tocando");
                botao.textContent = "Testar";
            }
        });
    }

    function prepararRadioParaAdicionar(indice) {
        const radio = radiosEncontradas[indice];

        if (!radio) {
            return;
        }

        const nome = (radio.name || "").trim().slice(0, 50);
        const url = obterUrlRadio(radio);

        fecharPesquisa();
        abrirModal(nome, url);
    }

    async function adicionarRadio(nome, url) {
        const resposta = await fetch("/api/radios", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                nome: nome,
                url: url,
                estrelas: estrelasSelecionadas
            })
        });

        if (!resposta.ok) {
            const dados = await resposta.json().catch(function () {
                return {};
            });

            throw new Error(
                dados.erro ||
                "Não foi possível adicionar a rádio"
            );
        }
    }

    async function excluirRadio(id) {
        const radio = radios.find(function (item) {
            return Number(item.id) === id;
        });

        if (!radio) {
            return;
        }

        const confirmado = confirm(
            'Excluir a rádio "' + radio.nome + '"?'
        );

        if (!confirmado) {
            return;
        }

        try {
            const resposta = await fetch(
                "/api/radios?id=" + id,
                {
                    method: "DELETE"
                }
            );

            if (!resposta.ok) {
                const dados = await resposta.json().catch(function () {
                    return {};
                });

                throw new Error(
                    dados.erro ||
                    "Não foi possível excluir a rádio"
                );
            }

            await carregarRadios();
        } catch (erro) {
            alert(erro.message);
        }
    }

    document
        .getElementById("btnNovaRadio")
        .addEventListener("click", function () {
            abrirModal();
        });

    document
        .getElementById("btnPesquisarRadio")
        .addEventListener("click", abrirPesquisa);

    document
        .getElementById("btnFecharModal")
        .addEventListener("click", fecharModal);

    document
        .getElementById("btnCancelar")
        .addEventListener("click", fecharModal);

    document
        .getElementById("btnFecharPesquisa")
        .addEventListener("click", fecharPesquisa);

    formPesquisa.addEventListener("submit", function (evento) {
        evento.preventDefault();
        pesquisarRadios();
    });

    resultadosPesquisa.addEventListener("click", function (evento) {
        const botaoTestar = evento.target.closest(".btn-testar");

        if (botaoTestar) {
            testarRadio(Number(botaoTestar.dataset.indice));
            return;
        }

        const botaoImportar = evento.target.closest(".btn-importar");

        if (botaoImportar) {
            prepararRadioParaAdicionar(
                Number(botaoImportar.dataset.indice)
            );
        }
    });

    playerPreview.addEventListener("playing", function () {
        statusPreview.textContent = "Reproduzindo prévia";
    });

    playerPreview.addEventListener("waiting", function () {
        statusPreview.textContent = "Carregando transmissão...";
    });

    playerPreview.addEventListener("error", function () {
        statusPreview.textContent =
            "Esta transmissão não pôde ser reproduzida no navegador.";
    });

    botoesEstrelas.forEach(function (botao) {
        botao.addEventListener("click", function () {
            estrelasSelecionadas = Number(
                botao.dataset.valor
            );

            atualizarSeletorEstrelas();
        });
    });

    formRadio.addEventListener(
        "submit",
        async function (evento) {
            evento.preventDefault();

            const nome = campoNome.value.trim();
            const url = campoUrl.value.trim();

            if (!nome || !url) {
                return;
            }

            const botaoAdicionar = formRadio.querySelector(
                ".btn-adicionar"
            );

            botaoAdicionar.disabled = true;
            botaoAdicionar.textContent = "Adicionando...";

            try {
                await adicionarRadio(nome, url);

                fecharModal();
                await carregarRadios();
            } catch (erro) {
                alert(erro.message);
            } finally {
                botaoAdicionar.disabled = false;
                botaoAdicionar.textContent = "Adicionar";
            }
        }
    );

    corpoTabela.addEventListener("click", function (evento) {
        const botao = evento.target.closest(".btn-excluir");

        if (!botao) {
            return;
        }

        excluirRadio(Number(botao.dataset.id));
    });

    modalRadio.addEventListener("click", function (evento) {
        if (evento.target === modalRadio) {
            fecharModal();
        }
    });

    modalPesquisa.addEventListener("click", function (evento) {
        if (evento.target === modalPesquisa) {
            fecharPesquisa();
        }
    });

    document.addEventListener("keydown", function (evento) {
        if (evento.key === "Escape") {
            fecharModal();
            fecharPesquisa();
        }
    });

    atualizarSeletorEstrelas();
    carregarRadios();
</script>
</body>
</html>
